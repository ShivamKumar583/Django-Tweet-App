{% extends "layout.html" %}

{% block title %}
    Tweet Page
{% endblock %}

{% block content %}
    <h1 class=' text-white text-center text-3xl'>Login Form</h1>

        <form method="post" >
            {% csrf_token %}
            {{form.as_p}}
            <button class='btn btn-primary' type='submit'>Login</button>
        </form>
        <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
{% endblock %}
