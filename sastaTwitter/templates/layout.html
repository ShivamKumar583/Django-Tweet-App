{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>
        {% block title %}
            Tweet App
        {% endblock %}
    </title>
</head>
<body class=" bg-dark">
    <nav class="navbar bg-dark border-b-2 border">
        <div class="bg-dark container-fluid">
          <a class="navbar-brand text-white">Tweet</a>

          <div class="d-flex gap-2">
            <form class="d-flex bg-dark" role="search">
                <input class="form-control text-white bg-dark me-2" type="search" placeholder="Search" aria-label="Search">
                <button class="btn bg-dark btn-outline-success" type="submit">Search</button>
              </form>
            <a href="{% url 'tweet_list' %}" class="btn btn-primary">Tweet Home</a>

          {% if user.is_authenticated %}
          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type='submit'>Logout</button>
          </form>
          {% else %}
          <a href="{% url 'register' %}" class="btn btn-primary">Register</a>
          
          <a href="{% url 'login' %}" class="btn btn-primary">Login</a>
          {% endif %}
          </div>
          


        </div>
      </nav>

    <div class='container bg-dark text-white'>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
