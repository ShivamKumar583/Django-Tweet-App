{% extends "layout.html" %}

{% block title %}
    Tweet Page
{% endblock %}

{% block content %}
    <h1 class=' text-white text-center text-3xl'>Welcome to new Tweet App created with django</h1>

    <a href={% url 'tweet_create'%}>
        <button type="button" class="btn btn-primary">Create Tweet</button>
    </a>

    <div class='container row gap-3'>
        {% for tweet in tweets %}
        
        <div class="card text-white mt-2 bg-dark border " style="width: 18rem;">
            <img src="{{tweet.photo.url}}" class="card-img-top" alt="...">
            <div class="card-body">
              <h5 class="card-title">{{tweet.user.usernane}}</h5>
              <p class="card-text">{{tweet.text}}</p>

              {% if tweet.user == user %}
              <a href="{% url 'tweet_edit' tweet.id %}" class="btn btn-primary">Edit</a>
              <a href="{% url 'tweet_delete' tweet.id %}" class="btn btn-danger">Delete</a>
              {% endif %}
            </div>
          </div>

    {% endfor %}
    </div>

    
{% endblock %}
